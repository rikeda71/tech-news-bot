version: 2
updates:
  # pnpm workspace 全体の依存を週次で自動 PR (security fix の遅延を最大 1 週間に抑える)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Node.js LTS 24 を当面利用するため、@types/node の major bump は対象外にする
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      production-deps:
        # production 依存の minor / patch をすべて 1 PR にまとめる
        # major は互換性リスクが高いのでグループ外 (個別 PR) に残す
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-deps:
        # devDependencies の minor / patch をすべて 1 PR にまとめる
        # types / vite / cloudflare 等のサブグループは廃止してここに統合
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions のバージョンを週次で自動 PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gha-deps:
        # GitHub Actions の minor / patch をすべて 1 PR にまとめる
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
