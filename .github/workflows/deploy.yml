name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "migrations/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm cf-typegen
      - name: vp build
        run: vp run build
      - name: Apply D1 migrations
        working-directory: apps/web
        # D1 が一時的に SQLITE_LOCKED を返すことがあるため、最大 3 回リトライする
        run: |
          for i in 1 2 3; do
            pnpm exec wrangler d1 migrations apply tech-news-bot-db --remote && break
            if [ $i -lt 3 ]; then
              echo "Migration attempt $i failed, retrying in 10s..."
              sleep 10
            else
              echo "Migration failed after 3 attempts"
              exit 1
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # GitHub に登録した WORKER_ADMIN_TOKEN を Worker の ADMIN_TOKEN secret に同期する。
      # 二重登録を避けるため secret は GH 側を single source of truth として扱う。
      - name: Sync admin secret to Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${WORKER_ADMIN_TOKEN:-}" ]; then
            printf '%s' "$WORKER_ADMIN_TOKEN" | pnpm exec wrangler secret put ADMIN_TOKEN
          else
            echo "WORKER_ADMIN_TOKEN GitHub secret not set; skipping sync."
          fi
      - name: Deploy worker
        working-directory: apps/web
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
