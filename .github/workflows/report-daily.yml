name: Report Daily

# 毎朝 JST 07:00 に tech-news-digest skill を Claude Code で起動し、
# 生成された markdown を D1 reports テーブルに保存する。
# 詳細は docs/reports-pipeline.md 参照。
on:
  schedule:
    - cron: "0 22 * * *" # UTC 22:00 = JST 07:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: report-daily
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Claude Code が tools/d1-client/recent.mjs を呼ぶときに wrangler が必要。
      # cf-typegen は build に依存するため明示的に走らせない (skill は recent.mjs しか使わない)。

      - name: Run tech-news-digest skill
        uses: anthropics/claude-code-base-action@beta
        env:
          # claude-code-base-action 内部の Setup Node.js が default 18 を入れるため、
          # wrangler d1 (Node v20+ 必須) が落ちる。skill が呼ぶ recent.mjs のために 24 を強制。
          NODE_VERSION: "24"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # CLI 内部 (WebFetch URL 要約など) の haiku デフォルトが廃止モデル
          # claude-3-5-haiku-20241022 になっており 404 で失敗するため、現行版に上書き。
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "claude-haiku-4-5-20251001"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 廃止モデル (claude-3-5-haiku-20241022) への自動 fallback で 404 が出るため
          # 現行 sonnet を明示する。
          model: "claude-sonnet-4-5-20250929"
          allowed_tools: "Bash,Read,Write,WebFetch,Skill"
          timeout_minutes: 30
          # daily digest 生成プロンプト。skill 起動と最終ファイル書き出しを明示する。
          prompt: |
            あなたは tech-news-bot の自動レポート生成エージェントです。

            tech-news-digest skill を以下の引数で起動してください:
            - since=today
            - mode=deep
            - target=remote
            - zenn カテゴリは除外 (bigtech / ai / jp の 3 カテゴリを対象にする)
            - lang 指定なし

            Stage 1 では bigtech / ai / jp の 3 カテゴリを 1 回の呼び出しで取得してください:
              node tools/d1-client/recent.mjs --since=today --category=bigtech,ai,jp --target=remote --limit=600
            取得した articles[] を対象に URL de-dup (古い published_at 優先) する。
            以降の Stage はマージ済み articles を対象とする。

            Stage 1〜4 を完走したあと、最終的な markdown レポート全文を /tmp/report.md に
            書き出してください。レポートには以下の節を必ず含めてください:
            - `## Pick 記事リンク一覧` (必須・省略禁止): 各記事にタイトル/URL/feed_name/category/YYYY-MM-DD/1〜2文要約を含む
            - `## カテゴリ別動向` (必須): bigtech / ai / jp の各サブセクション (###) でカテゴリごとの技術動向をサマる

            合わせて以下の JSON を /tmp/report-meta.json に書き出してください:

            {
              "kind": "daily",
              "period_start": "<since の ISO 8601>",
              "period_end":   "<実行時刻の ISO 8601>",
              "category": null,
              "lang": null,
              "included_categories": ["bigtech","ai","jp"],
              "source_skill": "tech-news-digest",
              "generated_at": "<実行時刻の ISO 8601>",
              "dedup_total": <number>,
              "by_category": <object>,
              "by_feed": <object>
            }

            注意:
            - recent.mjs を呼ぶときは --target=remote を必ず指定してください。
            - 最終 markdown 出力以外のアシスタント発話は最小限に抑えてください。
            - WebFetch が失敗した記事には (summary based) を末尾に付けてください。

            加えて、Slack 投稿用のメッセージを /tmp/slack-message.md に書き出してください。
            - Slack mrkdwn 記法 (*bold*, _italic_, <URL|label>)
            - 30000 文字以内 (上限。長くても構わない)
            - 冒頭にレポート概要を 1〜2 文
            - その後に「カテゴリ別ハイライト (bigtech / ai / jp)」「注目記事 (各記事は 1 行、リンク付き)」を Slack で読みやすく整形
            - 末尾に viewer URL は付けない (Actions 側で自動付与される)

      - name: Save report to D1 via admin API
        env:
          ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
          # 本番 Worker の URL (custom domain がない前提)
          WORKER_URL: https://tech-news-bot.rikeda71.workers.dev
        run: |
          set -euo pipefail
          if [ ! -f /tmp/report.md ] || [ ! -f /tmp/report-meta.json ]; then
            echo "Skill did not produce required output files; aborting."
            exit 1
          fi

          # report-meta.json は kind / period_start / period_end / category / lang /
          # source_skill / generated_at と追加メタ (dedup_total, by_category, ...) を含む。
          # API body は { ...meta, content, meta } の形に jq で組み立てる。
          jq \
            --rawfile content /tmp/report.md \
            '{
              kind: .kind,
              period_start: .period_start,
              period_end: .period_end,
              category: .category,
              lang: .lang,
              source_skill: .source_skill,
              generated_at: .generated_at,
              content: $content,
              meta: { dedup_total: .dedup_total, by_category: .by_category, by_feed: .by_feed, included_categories: .included_categories }
            }' /tmp/report-meta.json > /tmp/report-payload.json

          HTTP_STATUS=$(curl -sS -w '%{http_code}' -X POST "$WORKER_URL/api/admin/reports" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -o /tmp/post-resp.json \
            --data-binary @/tmp/report-payload.json)
          if [[ "$HTTP_STATUS" != 2* ]]; then
            echo "API returned HTTP $HTTP_STATUS" >&2
            cat /tmp/post-resp.json >&2
            exit 1
          fi

      - name: Post to Slack (threaded)
        if: ${{ success() }}
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          WORKER_URL: https://tech-news-bot.rikeda71.workers.dev
        run: |
          set -euo pipefail

          # required secrets / files の存在チェック (skip 条件)
          if [ -z "${SLACK_BOT_TOKEN:-}" ] || [ -z "${SLACK_CHANNEL_ID:-}" ]; then
            echo "SLACK_BOT_TOKEN or SLACK_CHANNEL_ID not set – skipping Slack thread post"
            exit 0
          fi
          if [ ! -f /tmp/slack-message.md ] || [ ! -f /tmp/post-resp.json ] || [ ! -f /tmp/report-meta.json ]; then
            echo "Required files missing – skipping Slack thread post"
            exit 0
          fi

          REPORT_ID=$(jq -r '.id' /tmp/post-resp.json)
          if [ -z "$REPORT_ID" ] || [ "$REPORT_ID" = "null" ]; then
            echo "report id missing – skipping"
            exit 0
          fi
          VIEWER_URL="$WORKER_URL/reports/$REPORT_ID"

          PERIOD_END=$(jq -r '.period_end' /tmp/report-meta.json)
          GENERATED_AT=$(jq -r '.generated_at' /tmp/report-meta.json)

          # Build title (daily is fixed)
          DATE_LABEL=$(echo "$PERIOD_END" | cut -c1-10)
          TITLE="🟢 Daily Tech Report ($DATE_LABEL)"
          SEVERITY="重要度: 低"

          # ===== Step A: post parent (title + severity) =====
          PARENT_PAYLOAD=$(jq -n \
            --arg ch "$SLACK_CHANNEL_ID" \
            --arg t "$TITLE" \
            --arg s "$SEVERITY · generated_at: $GENERATED_AT" \
            '{
              channel: $ch,
              text: $t,
              blocks: [
                { type: "header", text: { type: "plain_text", text: $t, emoji: true } },
                { type: "context", elements: [ { type: "mrkdwn", text: $s } ] }
              ]
            }')

          PARENT_RESP=$(curl -fsS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$PARENT_PAYLOAD")

          PARENT_OK=$(echo "$PARENT_RESP" | jq -r '.ok')
          if [ "$PARENT_OK" != "true" ]; then
            ERR=$(echo "$PARENT_RESP" | jq -r '.error // "unknown"')
            echo "Parent post failed: $ERR"
            exit 0
          fi
          THREAD_TS=$(echo "$PARENT_RESP" | jq -r '.ts')
          if [ -z "$THREAD_TS" ] || [ "$THREAD_TS" = "null" ]; then
            echo "Parent ts missing – skipping child post"; exit 0
          fi

          # ===== Step B: post child (chunked body in thread) =====
          # python で UTF-8 バイト境界で安全に chunk 分割。runner 標準で python3 が入っている。
          CHILD_PAYLOAD=$(VIEWER_URL="$VIEWER_URL" SLACK_CHANNEL_ID="$SLACK_CHANNEL_ID" THREAD_TS="$THREAD_TS" python3 - <<'PYEOF'
          import json, os
          def split_by_utf8_bytes(text, max_bytes):
              """Split text into chunks where each chunk is at most max_bytes UTF-8 bytes.
              Splits only at character boundaries to avoid breaking surrogates."""
              encoded = text.encode('utf-8')
              chunks = []
              start = 0
              while start < len(encoded):
                  end = start + max_bytes
                  if end >= len(encoded):
                      chunks.append(encoded[start:].decode('utf-8'))
                      break
                  # Walk back to a valid UTF-8 character boundary
                  while end > start and (encoded[end] & 0xC0) == 0x80:
                      end -= 1
                  chunks.append(encoded[start:end].decode('utf-8'))
                  start = end
              return chunks
          with open('/tmp/slack-message.md', encoding='utf-8') as f:
              msg = f.read().rstrip()
          MAX_BYTES = 2800   # Slack mrkdwn block limit 3000 bytes (UTF-8) 安全側
          MAX_BLOCKS = 48    # divider + section (viewer link) のために 2 枠残す
          chunks = split_by_utf8_bytes(msg, MAX_BYTES)
          truncated = False
          if len(chunks) > MAX_BLOCKS:
              chunks = chunks[:MAX_BLOCKS]
              truncated = True
          blocks = [{"type": "section", "text": {"type": "mrkdwn", "text": c}} for c in chunks]
          if truncated:
              blocks.append({"type": "context", "elements": [{"type": "mrkdwn",
                  "text": "_…本文が長すぎたため一部省略されました。続きは Web viewer で_"}]})
          blocks.append({"type": "divider"})
          blocks.append({"type": "section", "text": {"type": "mrkdwn",
              "text": f"<{os.environ['VIEWER_URL']}|レポート全文を Web で開く>"}})
          payload = {
              "channel": os.environ['SLACK_CHANNEL_ID'],
              "thread_ts": os.environ['THREAD_TS'],
              "text": "レポート本文",
              "blocks": blocks,
          }
          print(json.dumps(payload, ensure_ascii=False))
          PYEOF
          )

          CHILD_RESP=$(curl -fsS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$CHILD_PAYLOAD")

          CHILD_OK=$(echo "$CHILD_RESP" | jq -r '.ok')
          if [ "$CHILD_OK" != "true" ]; then
            ERR=$(echo "$CHILD_RESP" | jq -r '.error // "unknown"')
            echo "Child post failed: $ERR"
            exit 0
          fi
          echo "Posted parent + thread successfully (ts=$THREAD_TS)"
