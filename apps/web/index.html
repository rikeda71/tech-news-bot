<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="海外 big tech / AI / 国内企業の tech blog 記事を集約" />
    <link
      rel="alternate"
      type="application/feed+json"
      title="Tech News Bot (JSON Feed)"
      href="/feed.json"
    />
    <link rel="alternate" type="application/rss+xml" title="Tech News Bot (RSS)" href="/feed.xml" />
    <title>Tech News Bot</title>
    <!-- FOUC 防止: React マウント前に data-theme を確定させる -->
    <script>
      (function () {
        var v = "system";
        try {
          v = localStorage.getItem("tnb:theme") || "system";
        } catch (_) {}
        var resolved =
          v === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : v;
        document.documentElement.setAttribute("data-theme", resolved);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/client/main.tsx"></script>
  </body>
</html>
