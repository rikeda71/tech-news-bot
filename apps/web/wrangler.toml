name = "tech-news-bot"
main = "worker/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "tech-news-bot-db"
database_id = "a6cd7dbc-9f26-46d9-83c8-4a7b89405b7b"
migrations_dir = "../../migrations"

[triggers]
# 0 */6 * * * : 6 時間ごと (UTC 00,06,12,18) — RSS 収集
# Medium 等の外部レート制限と Worker 1 invocation あたりの subrequest 上限を緩和するため
# 3h → 6h に頻度を下げている。新着の取り込みは最大 6 時間遅れる。
crons = ["0 */6 * * *"]

[vars]
# 並列 1: 同一ホスト (Medium) への並列アクセスで 429 を多発させないため。
# fetch の wallclock は Cron の wall-time 上限内で十分収まる。
COLLECTOR_CONCURRENCY = "1"
COLLECTOR_TIMEOUT_MS = "10000"
COLLECTOR_RETRIES = "2"
SUMMARY_MAX_LENGTH = "500"
RETENTION_DAYS = "90"
# カンマ区切りで許可する Origin を列挙。* は非推奨 (明示的 origin で制限する)
CORS_ALLOWED_ORIGINS = "https://tech-news-bot.rikeda71.workers.dev"
ALERT_MIN_FAILURES = "3"
ALERT_FEED_STREAK = "5"
COLLECTOR_ALERT_THRESHOLD = "5"

# Cloudflare Access (Zero Trust) — /api/admin/* の認証
# CF_ACCESS_AUD と CF_ACCESS_TEAM_DOMAIN は本番では `wrangler secret put` で登録する
# (toml には書かない)。Phase 1 では Access の本設定が完了するまで JWT 検証を bypass する。
# Cloudflare One ダッシュボードで Self-hosted application を作成し、secret を登録した後、
# この行を削除して JWT 検証を有効化する。詳細は docs/auth.md を参照。
# TODO(#375): CF_ACCESS_AUD / CF_ACCESS_TEAM_DOMAIN を secret 登録した時点でこの行を削除する。
# 削除を忘れると本番で /api/admin/* が adminAuthMiddleware (Bearer) のみで守られる状態が継続する。
SKIP_ACCESS_JWT = "1"

[[analytics_engine_datasets]]
binding = "COLLECTOR_AE"
dataset = "tnb_collector_events"

# preview 環境: PR ごとに動的な Worker 名は wrangler CLI の --name で指定する。
# D1 は本番と同じ DB を使い、READONLY=1 で admin/collector を無効化する。
[env.preview]
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[env.preview.observability]
enabled = true

[env.preview.assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "tech-news-bot-db"
database_id = "a6cd7dbc-9f26-46d9-83c8-4a7b89405b7b"

[env.preview.vars]
COLLECTOR_CONCURRENCY = "1"
COLLECTOR_TIMEOUT_MS = "10000"
COLLECTOR_RETRIES = "2"
SUMMARY_MAX_LENGTH = "500"
RETENTION_DAYS = "90"
READONLY = "1"
CORS_ALLOWED_ORIGINS = "https://tech-news-bot.rikeda71.workers.dev"
ALERT_MIN_FAILURES = "3"
ALERT_FEED_STREAK = "5"
# preview 環境では Access が前段に居ないため JWT 検証を bypass する。
SKIP_ACCESS_JWT = "1"
